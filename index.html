<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>17 個財富檔案｜人生關係多視角版</title>
<style>
:root{--ink:#172033;--muted:#697386;--paper:#f7f5ef;--card:#fff;--rich:#2f6b4f;--richbg:#eaf4ee;--poor:#983d3d;--poorbg:#fbeded;--line:#dfe3ea}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--paper);color:var(--ink)}
header{max-width:1180px;margin:auto;padding:42px 24px 24px}h1{font-size:clamp(32px,5vw,56px);line-height:1.05;margin:0 0 14px;letter-spacing:-.04em}header p{font-size:17px;line-height:1.8;color:var(--muted);max-width:850px;margin:0}.tag{display:inline-block;margin-bottom:14px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:800}
.toolbar{position:sticky;top:0;z-index:5;background:rgba(247,245,239,.95);backdrop-filter:blur(12px);border-block:1px solid var(--line)}.toolbar-inner{max-width:1180px;margin:auto;padding:12px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#search{min-width:220px;flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:999px;cursor:pointer;font-weight:700}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1180px;margin:auto;padding:26px 24px 50px}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:0 0 18px}.section-head h2{font-size:30px;margin:0}.section-head p{margin:0;color:var(--muted)}.rows{display:grid;gap:10px}.row{display:grid;grid-template-columns:54px 210px 1fr 1fr;gap:10px}.cell{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);display:flex;align-items:center}.num{justify-content:center;color:var(--muted);font-weight:800}.topic{font-weight:900}.pair{gap:10px;min-height:58px}.pair span{font-size:12px;font-weight:900;letter-spacing:.1em;padding:4px 7px;border-radius:999px;background:#fff}.pair b{font-size:17px;line-height:1.45}.rich{background:var(--richbg);color:var(--rich)}.poor{background:var(--poorbg);color:var(--poor)}.hidden{display:none}.loading{padding:40px 0;color:var(--muted)}footer{max-width:1180px;margin:auto;padding:0 24px 48px;color:var(--muted);font-size:13px}
@media(max-width:820px){.row{grid-template-columns:42px 1fr}.pair{grid-column:1/-1}.section-head{display:block}.section-head p{margin-top:6px}}
</style>
</head>
<body>
<header><div class="tag">從一本書，延伸到 11 種人生視角</div><h1>17 個財富檔案<br>人生關係多視角版</h1><p>不是把「富／窮」只拿來談錢，而是看一段關係、一種生活、一個人，究竟是在累積生命，還是在漏損生命。富＝擴張、累積、創造；窮＝消耗、受困、反應。</p></header>
<div class="toolbar"><div class="toolbar-inner"><input id="search" placeholder="搜尋：行動、幸福、問題……"><div id="tabs" class="tabs"></div></div></div>
<main><div class="section-head"><div><h2 id="title">載入中</h2><p id="subtitle">17 個財富檔案 × 不同人生面向</p></div></div><div id="rows" class="rows"><div class="loading">資料載入中…</div></div></main>
<footer>整理自 2026-08-13 多版本內容；哥哥版保留短句、可直接閱讀的設計。</footer>
<script>
const cats=[['原文','original'],['家庭關係','family'],['父子','father-son'],['父母','parent'],['夫妻','couple'],['自我學習','learning'],['自我幸福','happiness'],['靈魂','soul'],['精彩','exciting'],['豐富','abundant'],['哥哥｜願望與能力','brother']];
let current=[],active=cats[0];const tabs=document.getElementById('tabs'),rows=document.getElementById('rows'),search=document.getElementById('search'),title=document.getElementById('title');
for(const c of cats){const b=document.createElement('button');b.className='tab'+(c===active?' active':'');b.textContent=c[0];b.onclick=()=>load(c,b);tabs.appendChild(b)}
async function load(c,b){active=c;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');search.value='';title.textContent=c[0];rows.innerHTML='<div class="loading">資料載入中…</div>';const r=await fetch('data/'+c[1]+'.json');current=await r.json();render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const q=search.value.trim().toLowerCase();rows.innerHTML=current.filter(r=>!q||r.join(' ').toLowerCase().includes(q)).map(r=>`<article class="row"><div class="cell num">${esc(r[0])}</div><div class="cell topic">${esc(r[1])}</div><div class="cell pair rich"><span>富</span><b>${esc(r[2])}</b></div><div class="cell pair poor"><span>窮</span><b>${esc(r[3])}</b></div></article>`).join('')||'<div class="loading">沒有符合的內容。</div>'}
search.addEventListener('input',render);load(cats[0],document.querySelector('.tab'));
</script>
</body></html>
